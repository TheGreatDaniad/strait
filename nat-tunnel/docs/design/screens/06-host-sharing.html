<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share your connection</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F5F8FA}
a{color:#0E5A7A}a:hover{color:#0A4560}
.tab:hover{color:#0F1C24 !important}.primary:hover{background:#0A4560 !important}.ghost:hover{background:#EEF3F6 !important}
a:focus-visible,button:focus-visible{outline:2px solid #0E5A7A;outline-offset:2px}
@keyframes flow{from{left:0}to{left:calc(100% - 6px)}}
.pkt{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:#0E5A7A;animation:flow 1.6s linear infinite}
.pkt2{animation-delay:-0.8s}
@media (prefers-reduced-motion: reduce){.pkt{display:none}}
</style>
</head>
<body>
<div style="width: 420px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F8FA; color: #0F1C24; font-family: Inter, system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0">
    <span style="display: flex; align-items: center; gap: 8px; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 600; font-size: 19px; letter-spacing: -0.01em"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="st-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E5A7A"></stop><stop offset="1" stop-color="#0F9D8A"></stop></linearGradient></defs><path d="M17 5.5C13 3.5 7 5 7.5 9S16.5 13 16.5 16.5 10 21 6.5 18.5" stroke="url(#st-g)" stroke-width="2.8" fill="none" stroke-linecap="round"></path><circle cx="17.5" cy="5.6" r="2.5" fill="#0E5A7A"></circle><circle cx="6.3" cy="18.4" r="2.5" fill="#0F9D8A"></circle></svg>Strait</span>
    <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #E3EFF5; color: #0A4560; font-size: 12px; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 50%; background: #0E5A7A"></span>Sharing</span>
  </header>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin: 12px 20px 0; padding: 4px; border-radius: 12px; background: #E9EFF3">
    <a href="01-connect-idle.html" class="tab" style="display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 9px; color: #576773; text-decoration: none; font-weight: 500">Connect</a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,28,36,0.1); color: #0F1C24; text-decoration: none; font-weight: 600">Host</a>
    <a href="07-settings.html" class="tab" style="display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 9px; color: #576773; text-decoration: none; font-weight: 500">Settings</a>
  </nav>

  <div style="margin: 16px 20px 0; padding: 24px 20px 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #C3DCE8; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="display: flex; align-items: flex-start">
      <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #E3EFF5; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E5A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg></div>
        <span style="font-size: 12px; font-weight: 500; color: #576773">Peer</span>
      </div>
      <div style="flex: 1; position: relative; margin-top: 25px; height: 2px; background: #9CC3D6"><span class="pkt"></span><span class="pkt pkt2"></span></div>
      <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #0E5A7A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 16.5h.01M11 16.5h.01"></path><path d="M8.5 9.5a5 5 0 0 1 7 0M6 7a8.5 8.5 0 0 1 12 0"></path></svg></div>
        <span style="font-size: 12px; font-weight: 600; color: #0F1C24">You</span>
      </div>
      <div style="flex: 1; position: relative; margin-top: 25px; height: 2px; background: #9CC3D6"><span class="pkt"></span><span class="pkt pkt2"></span></div>
      <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #E3EFF5; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E5A7A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></div>
        <span style="font-size: 12px; font-weight: 500; color: #576773">Internet</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
      <h1 style="margin: 0; font-size: 17px; font-weight: 600; color: #083B52">Sharing your connection</h1>
      <p style="margin: 0; color: #576773; font-size: 13px">1 peer online · <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #0F1C24">13.5 MB</span></p>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #33424D">Invite code</span>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; min-width: 0; display: flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #CCD7DE; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">[RELAY]:7000|[ROOM]|••••••</div>
      <button type="button" class="primary" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #0E5A7A; color: #FFFFFF; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">Copy</button>
    </div>
  </div>

  <div style="margin-top: auto; padding: 20px">
    <a class="ghost" href="05-host-not-sharing.html" style="display: flex; align-items: center; justify-content: center; height: 48px; box-sizing: border-box; border: 1px solid #CCD7DE; border-radius: 12px; background: #FFFFFF; color: #0F1C24; font-weight: 600; font-size: 15px; text-decoration: none">Stop sharing</a>
  </div>
</div>
</body>
</html>
