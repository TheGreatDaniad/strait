name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: nat-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nat-tunnel
      - name: Test (headless build)
        run: cargo test --no-default-features --features "rv-sig,rv-trk,rv-nostr,rv-dht,rv-ntfy,rv-mqtt,cr-ss,cr-ws,cr-awg"
